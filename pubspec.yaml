name: calmwand_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Bluetooth Low Energy
  flutter_blue_plus: ^1.32.12

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts and graphs
  fl_chart: ^0.69.0

  # Utilities
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.0.3

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

  # Firebase for cloud sync
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - web/icons/appstore.png